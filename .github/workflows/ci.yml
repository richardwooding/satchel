name: CI
on:
  push:
    branches: [main]
  pull_request:

# app/ is a cgo package (Wails v3: GTK4 + WebKitGTK 6), so anything that
# compiles ./... needs those headers, not just the app build.
env:
  APP_DEPS: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APP_DEPS
      - run: go build ./...
      - run: go test -race -timeout 600s ./...
      - name: go fix (check)
        run: go fix -diff ./...
      - run: go vet ./...
      - name: WASM compile check
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/satchel-wasm ./internal/...
      - name: Full web build
        run: make wasm && go build ./cmd/satchel-relay

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APP_DEPS
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
      - name: Build the tray app (bindings, frontend, binary)
        working-directory: app
        run: wails3 task build
      - run: test -x app/bin/satchel

  # The Flatpak, built exactly as a release builds it, kept as an artifact so
  # a change can be installed and tried before it is tagged.
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo build app/build/linux/flatpak/io.github.richardwooding.satchel.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo satchel.flatpak io.github.richardwooding.satchel
      - uses: actions/upload-artifact@v5
        with:
          name: satchel-flatpak
          path: satchel.flatpak
          retention-days: 14

  complexity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardwooding/codemetrics@v0.12.7
        with:
          max-cognitive: "15"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APP_DEPS
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
