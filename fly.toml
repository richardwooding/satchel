# satchel's relay holds live sessions in memory, so auto-stop would cut
# transfers mid-flight. Unlike confab, every shared byte passes through this
# server (end-to-end encrypted), so bandwidth — not CPU — is what it costs.
app = "satchel-send"
primary_region = "jnb"

[build]
  image = "ghcr.io/richardwooding/satchel:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # One machine until the paired-device wake ping (/bell) routes by affinity;
  # a second machine would split a sender and a waiting receiver.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
