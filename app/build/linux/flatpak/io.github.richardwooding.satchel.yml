# satchel as a Flatpak. The GNOME runtime carries GTK4 and WebKitGTK 6, which
# is what an AppImage cannot do portably: WebKitGTK spawns its helper
# processes from a path compiled into the library.
#
# Built inside the GNOME SDK, not repackaged: a binary linked on a host with a
# newer glibc than the runtime's would not load in the sandbox.
#
# The build is offline, as Flathub requires. Every Go module file comes from
# go-sources.json (proxy.golang.org downloads, laid out as a file:// GOPROXY;
# go.sum still verifies each one) and every npm package from
# node-sources.json (pre-filled npm cache). The wails3 CLI is not used: the
# TypeScript bindings it generates are committed, and CI fails if they drift.
# Regenerate the source lists after any dependency change:
#
#   go run ./app/build/linux/flatpak/gosources > app/build/linux/flatpak/go-sources.json
#   flatpak-node-generator npm app/frontend/package-lock.json -o app/build/linux/flatpak/node-sources.json
#
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     --repo=repo build app/build/linux/flatpak/io.github.richardwooding.satchel.yml
id: io.github.richardwooding.satchel
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
  - org.freedesktop.Sdk.Extension.node24
command: satchel

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The relay and the paired-device bell.
  - --share=network
  # The tray icon (StatusNotifierItem) and its menu.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications with Accept / Decline / Show in folder buttons.
  - --talk-name=org.freedesktop.Notifications
  # The device's pairing key lives in the keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # Received files go here; any other folder is chosen through the portal.
  - --filesystem=xdg-download/satchel:create

modules:
  # Wayland gives the clipboard only to a focused window, and a tray app
  # usually has none; wl-copy/wl-paste get around that, and carry images.
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    cleanup:
      - /share/man
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb

  - name: satchel
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin:/usr/lib/sdk/node24/bin
      env:
        # In the build dir, so they survive between build commands (each runs
        # with a fresh /tmp), and dot-named, so the go tool skips them rather
        # than treating the module cache as packages of satchel.
        GOPATH: /run/build/satchel/.gopath
        GOMODCACHE: /run/build/satchel/.gopath/pkg/mod
        GOCACHE: /run/build/satchel/.gocache
        # Modules come only from the vendored proxy directory. go.sum still
        # checks every one; there is just no checksum database to ask.
        GOPROXY: file:///run/build/satchel/goproxy
        GOSUMDB: "off"
        GOFLAGS: -modcacherw
        # The SDK's Go (1.27.1) satisfies go.mod; never fetch another.
        GOTOOLCHAIN: local
        CGO_ENABLED: "1"
        # npm installs from the cache node-sources.json fills, never the net.
        XDG_CACHE_HOME: /run/build/satchel/flatpak-node/cache
        npm_config_cache: /run/build/satchel/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node24
        npm_config_offline: "true"
    build-commands:
      - go version
      - cd app/frontend && npm ci --offline && npm run build
      # VERSION is written by the release job; a local build says "dev".
      - >-
        go build -tags production -trimpath -buildvcs=false
        -ldflags "-w -s -X main.version=$(cat app/build/linux/flatpak/VERSION 2>/dev/null || echo dev)"
        -o satchel ./app
      - install -Dm755 satchel /app/bin/satchel
      - install -Dm644 app/build/linux/satchel-256.png /app/share/icons/hicolor/256x256/apps/io.github.richardwooding.satchel.png
      - install -Dm644 app/build/linux/satchel-512.png /app/share/icons/hicolor/512x512/apps/io.github.richardwooding.satchel.png
      - install -Dm644 app/build/linux/flatpak/io.github.richardwooding.satchel.desktop /app/share/applications/io.github.richardwooding.satchel.desktop
      - install -Dm644 app/build/linux/flatpak/io.github.richardwooding.satchel.metainfo.xml /app/share/metainfo/io.github.richardwooding.satchel.metainfo.xml
    sources:
      - type: dir
        path: ../../../..
        skip:
          - .git
          - app/bin
          - app/frontend/node_modules
          - app/frontend/dist
          - app/build/linux/flatpak/build
          - app/build/linux/flatpak/repo
          - app/build/linux/flatpak/.flatpak-builder
      - go-sources.json
      - node-sources.json
