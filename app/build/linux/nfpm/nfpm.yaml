# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "satchel"
arch: ${GOARCH}
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "extra"
maintainer: "Richard Wooding <richard.wooding@gmail.com>"
description: |-
  Croc-style sharing from the system tray.
  Share the clipboard, files and folders to a code phrase or a paired
  device, end-to-end encrypted through a relay that cannot read them.
vendor: "Richard Wooding"
homepage: "https://github.com/richardwooding/satchel"
license: "MIT"
release: "1"

contents:
  - src: "./bin/satchel"
    dst: "/usr/bin/satchel"
  - src: "./build/linux/satchel-256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/satchel.png"
  - src: "./build/linux/satchel-512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/satchel.png"
  - src: "./build/linux/satchel.desktop"
    dst: "/usr/share/applications/satchel.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# The clipboard goes through wl-clipboard on Wayland (or xclip on X11): GTK's
# clipboard blocks for an app with no focused window, which a tray app
# usually is. Without either, satchel still runs but cannot share images and
# says what to install when the clipboard is unreachable.
recommends:
  - wl-clipboard

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
    recommends:
      - wl-clipboard

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
